steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    env: ["DOCKER_BUILDKIT=1"]
    args: [build, -t, "${_IMAGE}:ai-$BUILD_ID", .]
  - id: native-effects
    name: gcr.io/cloud-builders/docker
    args:
      - run
      - --rm
      - --cpus=4
      - --memory=5g
      - --entrypoint=node
      - -e
      - FRAMEOS_QA_DIR=/qa
      - -v
      - /workspace/tools:/app/tools:ro
      - -v
      - /workspace/qa-output:/qa
      - "${_IMAGE}:ai-$BUILD_ID"
      - tools/ai-effects-qa.mjs
  - id: collect
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    args:
      [
        gcloud,
        storage,
        cp,
        -r,
        /workspace/qa-output,
        "gs://${_BUCKET}/ai-effects/$BUILD_ID/",
      ]
images: ["${_IMAGE}:ai-$BUILD_ID"]
substitutions:
  _IMAGE: asia-south1-docker.pkg.dev/gen-lang-client-0644821693/frameos/frameos-daemon
  _BUCKET: frameos-media-0644821693
timeout: 1800s
options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: 100
  logging: CLOUD_LOGGING_ONLY
