steps:
  - name: gcr.io/cloud-builders/docker
    env: ["DOCKER_BUILDKIT=1"]
    args:
      - build
      - --no-cache
      - -t
      - ${_IMAGE}:$BUILD_ID
      - -t
      - ${_IMAGE}:latest
      - .
  - name: gcr.io/cloud-builders/docker
    args: [push, "${_IMAGE}:$BUILD_ID"]
  - name: gcr.io/cloud-builders/docker
    args: [push, "${_IMAGE}:latest"]
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -ceu
      - |
        gcloud compute scp tools/deploy-daemon.sh ${_SSH_USER}@${_VM_NAME}:/tmp/frameos-deploy-$BUILD_ID.sh \
          --zone=${_VM_ZONE} \
          --project=${PROJECT_ID} \
          --tunnel-through-iap \
          --quiet
        gcloud compute ssh ${_SSH_USER}@${_VM_NAME} \
          --zone=${_VM_ZONE} \
          --project=${PROJECT_ID} \
          --tunnel-through-iap \
          --ssh-flag='-oStrictHostKeyChecking=no' \
          --quiet \
          --command='sudo bash /tmp/frameos-deploy-$BUILD_ID.sh ${_IMAGE}:$BUILD_ID'
substitutions:
  _REGION: asia-south1
  _IMAGE: asia-south1-docker.pkg.dev/gen-lang-client-0644821693/frameos/frameos-daemon
  _VM_NAME: frameos-studio
  _VM_ZONE: asia-south1-a
  # Cloud Build containers run as root by default. The VM's root SSH login is
  # disabled; use the provisioned OS Login administrator instead.
  _SSH_USER: adars
timeout: 1800s
options:
  logging: CLOUD_LOGGING_ONLY
