steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --no-cache
      - -t
      - ${_IMAGE}:$BUILD_ID
      - -t
      - ${_IMAGE}:latest
      - .
  - name: gcr.io/cloud-builders/docker
    args: [push, '${_IMAGE}:$BUILD_ID']
  - name: gcr.io/cloud-builders/docker
    args: [push, '${_IMAGE}:latest']
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -ceu
      - |
        gcloud compute ssh ${_SSH_USER}@${_VM_NAME} \
          --zone=${_VM_ZONE} \
          --project=${PROJECT_ID} \
          --tunnel-through-iap \
          --ssh-flag='-oStrictHostKeyChecking=no' \
          --quiet \
          --command='set -euo pipefail
            gcloud auth print-access-token | sudo docker login -u oauth2accesstoken --password-stdin https://${_REGION}-docker.pkg.dev >/dev/null
            sudo docker pull ${_IMAGE}:$BUILD_ID
            sudo docker rm -f frameos >/dev/null 2>&1 || true
            sudo docker run -d --name frameos --restart always --env-file /opt/frameos/.env -v /opt/frameos/data:/app/.frameos-data -p 31415:31415 ${_IMAGE}:$BUILD_ID
            sleep 4
            test "$(sudo docker inspect -f "{{.State.Running}}" frameos)" = "true"
          '
substitutions:
  _REGION: asia-south1
  _IMAGE: asia-south1-docker.pkg.dev/gen-lang-client-0644821693/frameos/frameos-daemon
  _VM_NAME: frameos-studio
  _VM_ZONE: asia-south1-a
  # Cloud Build containers run as root by default. The VM's root SSH login is
  # disabled; use the provisioned OS Login administrator instead.
  _SSH_USER: adars
timeout: 1800s
options:
  logging: CLOUD_LOGGING_ONLY
